name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/pearldrop-hero-video-d6wl0v]
  workflow_dispatch:

# Allow this workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes supersede in-progress ones
concurrency:
  group: pages
  # don't cancel a running deploy - Pages can sit in deployment_queued for
  # minutes, and cancelling mid-flight left the site on a stale build
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages automatically if it isn't already
          enablement: true

      # Deploys were taking ~9 minutes because the artifact carried 869 frame
      # files. Only frames-v2b/ is used by the live hero, so drop the legacy
      # sets and the source videos from the upload. This touches the checkout
      # only - everything stays in git, so the v1 rollback is unaffected.
      - name: Trim assets the live site does not serve
        run: |
          rm -rf frames frames-hd videos
          rm -f *.mp4
          echo "Publishing $(find . -path ./.git -prune -o -type f -print | wc -l) files"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (index.html + frames-v2b/ + logo)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the default 10 min wasn't enough when Pages queued the deployment,
          # which failed a run outright rather than just running slow
          timeout: 1200000
