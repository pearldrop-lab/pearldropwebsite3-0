name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/pearldrop-hero-video-d6wl0v]
  workflow_dispatch:

# Allow this workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes supersede in-progress ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages automatically if it isn't already
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (index.html + videos/)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
